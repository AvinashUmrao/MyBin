<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Exercise</title>
  <link rel="stylesheet" href="15.css">
</head>

<body>
  <div class="checkbox-container">
    <h3>Select your days (Max 3):</h3>

    <div class="days-group">
      <label><input type="checkbox" class="day-cb" value="sunday"> Sunday</label>
      <label><input type="checkbox" class="day-cb" value="monday"> Monday</label>
      <label><input type="checkbox" class="day-cb" value="tuesday"> Tuesday</label>
      <label><input type="checkbox" class="day-cb" value="wednesday"> Wednesday</label>
      <label><input type="checkbox" class="day-cb" value="thursday"> Thursday</label>
      <label><input type="checkbox" class="day-cb" value="friday"> Friday</label>
      <label><input type="checkbox" class="day-cb" value="saturday"> Saturday</label>
    </div>

    <div class="none-group">
      <label><input type="checkbox" id="none-cb" value="none"> None</label>
    </div>
  </div>

  <script src="15.js"></script>
</body>

</html>
