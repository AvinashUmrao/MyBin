
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent and Child Checkboxes</title>
  <link rel="stylesheet" href="18.css">
</head>
<body>
  <h3>Select your options</h3>

  <div class="checkbox-container">

    <div class="group">
      <label><input type="checkbox" class="parent-cb" data-target="colors"> Color</label>
      <div class="children" id="colors">
        <label><input type="checkbox" value="red"> Red</label>
        <label><input type="checkbox" value="yellow"> Yellow</label>
        <label><input type="checkbox" value="green"> Green</label>
        <label><input type="checkbox" value="blue"> Blue</label>
      </div>
    </div>

    <div class="group">
      <label><input type="checkbox" class="parent-cb" data-target="drinks"> Drinks</label>
      <div class="children" id="drinks">
        <label><input type="checkbox" value="coke"> Coke</label>
        <label><input type="checkbox" value="pepsi"> Pepsi</label>
        <label><input type="checkbox" value="dew"> Dew</label>
      </div>
    </div>

    <div class="group">
      <label><input type="checkbox" class="parent-cb" data-target="movies"> Movies</label>
      <div class="children" id="movies">
        <label><input type="checkbox" value="dar"> Dar</label>
        <label><input type="checkbox" value="sir"> Sir</label>
      </div>
    </div>

    <div class="group">
      <label><input type="checkbox" class="parent-cb" data-target="bikes"> Bikes</label>
      <div class="children" id="bikes">
        <label><input type="checkbox" value="v-rod"> V-rod</label>
        <label><input type="checkbox" value="pulsar"> Pulsar</label>
        <label><input type="checkbox" value="cbz"> CBZ</label>
      </div>
    </div>

  </div>

  <script src="18.js"></script>
</body>
</html>
